name: track

# Stage 3: once a day after the US close, record each candidate's and control's
# newly finished trading sessions and new SEC filings since its flag, for 20
# sessions, and rebuild track/outcomes.csv on the `data` branch. Details:
# docs/stage3.md. scripts/pace.sh starts it at the first pacer after 22:41 UTC
# (GitHub's cron here is unreliable); the cron is the backup, and the one that
# keeps tracking going after collection (and the pacer) has stopped. Once
# collection has finished and nothing is left to follow, it turns itself off.
on:
  schedule:
    - cron: "41 22 * * *"
  workflow_dispatch:

permissions:
  contents: write # push to the data branch
  actions: write # turn this workflow off when tracking is over

concurrency:
  # writes only track/, so its push replays cleanly on top of collect and market pushes
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Check out the data branch (state, candidates, snapshots, track tables)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/datastore.sh checkout-track datastore

      - name: Record new sessions and filings
        id: track
        env:
          # the contact SEC requires (see collect.yml); masked in the public logs, sent to sec.gov only
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pumpdump track --datastore datastore --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      - name: Push the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/datastore.sh push datastore "track: run ${{ github.run_id }}"

      - name: Turn tracking off once it is over
        if: steps.track.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow disable track.yml
