name: market

# Stage 2: after every collect run, take a market snapshot of each new
# candidate as of the moment it was flagged (price and volume vs its history,
# float, short interest, SEC dilution filings, archetype), plus two matched
# controls nobody was talking about, and push it to market/ on the `data`
# branch. Details: docs/stage2.md.
on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run_tickers:
        description: "Only print snapshots of these tickers (space separated); nothing is saved"
        required: false
        default: ""
      dry_run_as_of:
        description: "Snapshot time for the dry run, e.g. 2026-10-04T23:23:58Z (default: now)"
        required: false
        default: ""

permissions:
  contents: write # push to the data branch

concurrency:
  # one market run at a time; it writes only market/, so its push can be replayed on top of a collect push
  group: market
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Check out the data branch (candidates, symbols, market tables)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/datastore.sh checkout-market datastore

      - name: Snapshot new candidates
        env:
          # the contact SEC requires (see collect.yml); masked in the public logs, sent to sec.gov only
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DRY_RUN_TICKERS: ${{ inputs.dry_run_tickers }}
          DRY_RUN_AS_OF: ${{ inputs.dry_run_as_of }}
        run: |
          if [ -n "$DRY_RUN_TICKERS" ]; then
            read -ra tickers <<< "$DRY_RUN_TICKERS"
            python -m pumpdump market --datastore datastore --dry-run "${tickers[@]}" ${DRY_RUN_AS_OF:+--as-of "$DRY_RUN_AS_OF"}
          else
            python -m pumpdump market --datastore datastore --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the data branch
        if: ${{ !inputs.dry_run_tickers }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/datastore.sh push datastore "market: run ${{ github.run_id }}"
