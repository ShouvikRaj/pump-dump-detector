name: pace

# GitHub's 15-minute cron fires rarely for this repo, so collection paces
# itself: every collect run ends by starting this workflow, whose job waits out
# the `pacer` environment's 13-minute wait timer (set in the repo settings; no
# runner is held while it waits) and then starts the next collect run and
# queues the next pacer, so one lost run can't stop the chain. The cron stays
# as a restart path if the chain ever breaks.
on:
  workflow_dispatch:

permissions:
  contents: read # check out scripts/
  actions: write # start the next collect run

concurrency:
  # one pacer at a time plus at most one queued behind it (a newer queued one replaces the older);
  # not cancel-in-progress, because each pacer queues its successor while it is still running
  group: pace
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pacer
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Start the next collect run and queue the next pacer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/pace.sh
