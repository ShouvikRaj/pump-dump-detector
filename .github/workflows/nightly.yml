name: nightly

# Once a day: build a SQLite database of everything collected so far and
# attach it to the run as a downloadable artifact; keep the schedules alive
# (GitHub disables scheduled workflows after 60 days without activity).
# Once collection has finished (enough data, see README), publish the final
# database as the `dataset-final` release and turn both schedules off.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write # publish the final dataset release
  actions: write # keep the schedules on, or turn them off when collection finishes

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Check out the whole data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/datastore.sh checkout-all datastore

      - name: Build SQLite
        run: python -m pumpdump build-db --datastore datastore --out pumpdump.sqlite

      - uses: actions/upload-artifact@v4
        with:
          name: pumpdump-sqlite
          path: pumpdump.sqlite
          retention-days: 7
          if-no-files-found: ignore

      - name: Check whether collection has finished
        id: status
        run: python -m pumpdump status --datastore datastore --github-output "$GITHUB_OUTPUT"

      - name: Publish the final dataset and turn the schedules off
        if: steps.status.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.status.outputs.reason }}
        run: |
          gzip -kf pumpdump.sqlite
          if ! gh release view dataset-final >/dev/null 2>&1; then
            gh release create dataset-final pumpdump.sqlite.gz --target main --title "Stage 1 final dataset" \
              --notes "Collection finished ($REASON). SQLite database of everything on the data branch; gunzip it and open with sqlite3."
          fi
          gh workflow disable collect.yml
          gh workflow disable nightly.yml

      - name: Keep scheduled workflows enabled
        if: steps.status.outputs.finished != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect.yml nightly.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || echo "could not re-enable $wf"
          done
