name: collect

# Every 15 minutes: fetch new r/pennystocks, r/smallstreetbets and
# r/wallstreetbets posts and comments, store them on the `data` branch with
# collection timestamps, and update the candidate list. Off-the-hour minutes
# because GitHub's scheduler is busiest at :00.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Collection time budget in minutes"
        required: false
        default: "12"

permissions:
  contents: write # push to the data branch
  issues: write # open/close the health issue
  actions: write # count recent failed runs for the health issue; queue the next run and the market run

concurrency:
  group: datastore # one writer to the data branch at a time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Check out the data branch (last 9 days)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/datastore.sh checkout datastore 9

      - name: Collect, extract tickers, flag spikes
        env:
          # repository secret, e.g. "pump-dump-detector you@example.com": SEC refuses requests without a
          # reachable contact (GitHub no-reply addresses included); secrets are masked in the public logs
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python -m pumpdump collect
          --datastore datastore
          --max-minutes "${{ inputs.max_minutes || '12' }}"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Push the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/datastore.sh push datastore "collect: run ${{ github.run_id }}"

      - name: Start the market snapshot (Stage 2)
        # started here because GitHub's workflow_run event doesn't fire for runs the pacer starts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run market.yml --ref main || echo "::warning::could not start the market run"

      - name: Open or close the health issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_STATUS: ${{ job.status }}
        run: scripts/health_issue.sh datastore/reports/health.json

      - name: Queue the next run
        # the pace workflow waits 13 minutes, then starts collect again (GitHub's cron fires rarely here)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pace.yml --ref main || echo "::warning::could not queue the next run; the cron will restart it"
